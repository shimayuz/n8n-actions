name: Template-Aware Workflow Generator

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  analyze-issue:
    if: contains(github.event.issue.labels.*.name, 'workflow-request')
    runs-on: ubuntu-latest
    outputs:
      should_generate: ${{ steps.analyze.outputs.should_generate }}
      workflow_name: ${{ steps.analyze.outputs.workflow_name }}
      complexity: ${{ steps.analyze.outputs.complexity }}
      template_matches: ${{ steps.analyze.outputs.template_matches }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Analyze Issue Content
        id: analyze
        uses: actions/github-script@v7
        with:
          script: |
            const issueBody = context.payload.issue.body;
            console.log('Analyzing issue #' + context.issue.number);

            // Parse issue body for workflow details
            const workflowNameMatch = issueBody.match(/### Workflow Name\s*\n\s*(.+)/);
            const complexityMatch = issueBody.match(/### Workflow Complexity\s*\n\s*(.+)/);
            const integrationsMatch = issueBody.match(/### Required Integrations\s*\n\s*(.+)/);
            const descriptionMatch = issueBody.match(/### Workflow Description\s*\n\s*(.+)/);

            if (workflowNameMatch) {
              const workflowName = workflowNameMatch[1].trim();
              const complexity = complexityMatch ? complexityMatch[1].trim() : 'Medium';
              const integrations = integrationsMatch ? integrationsMatch[1].trim() : '';
              const description = descriptionMatch ? descriptionMatch[1].trim() : '';

              // Extract node requirements from integrations
              const nodeTypes = integrations.split(',').map(i => i.trim().toLowerCase());

              core.setOutput('should_generate', 'true');
              core.setOutput('workflow_name', workflowName);
              core.setOutput('complexity', complexity);

              // Store analysis data
              core.exportVariable('WORKFLOW_REQUIREMENTS', JSON.stringify({
                name: workflowName,
                complexity,
                integrations: nodeTypes,
                description,
                issue_number: context.issue.number
              }));

              // Add initial comment with template analysis
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `🤖 **AI Workflow Generation Started**

I'm analyzing your request for **${workflowName}**...

**📊 Analysis Results:**
- Complexity: ${complexity}
- Required integrations: ${integrations || 'None specified'}
- Description: ${description || 'None provided'}

**🔍 Template Matching:**
Searching for similar templates to ensure optimal node usage...

*Estimated time: 3-5 minutes*`
              });
            } else {
              core.setOutput('should_generate', 'false');
            }

  find-matching-templates:
    needs: analyze-issue
    if: needs.analyze-issue.outputs.should_generate == 'true'
    runs-on: ubuntu-latest
    outputs:
      template_data: ${{ steps.find-templates.outputs.template_data }}
      recommended_nodes: ${{ steps.find-templates.outputs.recommended_nodes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Initialize Template Database
        run: |
          # Ensure data directory exists
          mkdir -p data

          # Initialize database if it doesn't exist
          if [ ! -f "data/templates.db" ]; then
            echo "Initializing template database..."
            node -e "
              const { createDatabaseAdapter } = require('./src/database/database-adapter');
              const fs = require('fs');
              const path = require('path');

              createDatabaseAdapter('./data/templates.db').then(db => {
                const schema = fs.readFileSync('./database/template-schema.sql', 'utf8');
                db.exec(schema);
                console.log('Database initialized');
                db.close();
              });
            "
          fi

      - name: Fetch Latest Templates
        run: |
          # Fetch templates if database is empty or old
          TEMPLATES_COUNT=$(node -e "
            const { createDatabaseAdapter } = require('./src/database/database-adapter');
            createDatabaseAdapter('./data/templates.db').then(db => {
              const result = db.prepare('SELECT COUNT(*) as count FROM templates').get();
              console.log(result.count);
              db.close();
            });
          " 2>/dev/null || echo "0")

          if [ "$TEMPLATES_COUNT" -lt "100" ]; then
            echo "Fetching latest templates from n8n.io..."
            node src/templates/template-fetcher.ts ./data/templates.db
          else
            echo "Using existing template database ($TEMPLATES_COUNT templates)"
          fi

      - name: Find Matching Templates
        id: find-templates
        run: |
          # Extract workflow requirements
          WORKFLOW_DATA="$WORKFLOW_REQUIREMENTS"

          echo "Finding matching templates for: $WORKFLOW_DATA"

          # Run template matching script
          node -e "
            const { createDatabaseAdapter } = require('./src/database/database-adapter');
            const { TemplateService } = require('./src/templates/template-service');

            async function findTemplates() {
              const db = await createDatabaseAdapter('./data/templates.db');
              const service = new TemplateService(db);

              const requirements = JSON.parse(process.env.WORKFLOW_REQUIREMENTS);
              console.log('Requirements:', requirements);

              // Find matching templates
              const recommendations = await service.getWorkflowRecommendations({
                purpose: requirements.description || requirements.name,
                requiredIntegrations: requirements.integrations || [],
                complexity: requirements.complexity?.toLowerCase() || 'medium'
              });

              console.log('Found', recommendations.recommendedTemplates.length, 'matching templates');
              console.log('Recommended nodes:', recommendations.suggestedNodes.join(', '));

              // Output results
              console.log('::set-output name=template_data::' + JSON.stringify(recommendations.recommendedTemplates));
              console.log('::set-output name=recommended_nodes::' + JSON.stringify(recommendations.suggestedNodes));
              console.log('::set-output name=reasoning::' + recommendations.reasoning);

              db.close();
            }

            findTemplates().catch(console.error);
          "

  generate-workflow-with-templates:
    needs: [analyze-issue, find-matching-templates]
    if: needs.analyze-issue.outputs.should_generate == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Extract Issue Details
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const issueBody = context.payload.issue.body;

            // Extract all fields from issue template
            const fields = {
              workflow_name: '',
              description: '',
              trigger_type: '',
              integrations: '',
              data_flow: '',
              complexity: '',
              features: [],
              error_handling: '',
              success_criteria: '',
              test_data: '',
              environment: '',
              deadline: ''
            };

            // Parse each field
            const sections = issueBody.split('###');
            sections.forEach(section => {
              const lines = section.trim().split('\n');
              const header = lines[0].trim();
              const content = lines.slice(1).join('\n').trim();

              switch(header) {
                case 'Workflow Name':
                  fields.workflow_name = content;
                  break;
                case 'Workflow Description':
                  fields.description = content;
                  break;
                case 'Trigger Type':
                  fields.trigger_type = content;
                  break;
                case 'Required Integrations':
                  fields.integrations = content;
                  break;
                case 'Data Flow Specification':
                  fields.data_flow = content;
                  break;
                case 'Required Features':
                  fields.features = content.match(/\\[x\\]\\s+(.+)/g)?.map(m => m.replace(/\\[x\\]\\s+/, '')) || [];
                  break;
                case 'Error Handling Requirements':
                  fields.error_handling = content;
                  break;
                case 'Success Criteria':
                  fields.success_criteria = content;
                  break;
                case 'Test Data':
                  fields.test_data = content.replace(/```json\n?/, '').replace(/\n?```/, '');
                  break;
              }
            });

            // Save to environment
            core.exportVariable('ISSUE_NUMBER', context.issue.number);
            core.exportVariable('WORKFLOW_NAME', fields.workflow_name);
            core.exportVariable('WORKFLOW_REQUIREMENTS', JSON.stringify(fields));

            return fields;

      - name: Generate Workflow with Template Guidance
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEMPLATE_DATA: ${{ needs.find-matching-templates.outputs.template_data }}
          RECOMMENDED_NODES: ${{ needs.find-matching-templates.outputs.recommended_nodes }}
          GENERATION_MODE: 'template-guided'
        run: |
          echo "🚀 Generating workflow with template guidance..."

          # Create enhanced generation script
          cat > generate-with-templates.js << 'EOF'
          const https = require('https');
          const fs = require('fs');

          const TEMPLATE_DATA = process.env.TEMPLATE_DATA;
          const RECOMMENDED_NODES = process.env.RECOMMENDED_NODES;
          const WORKFLOW_REQUIREMENTS = process.env.WORKFLOW_REQUIREMENTS;

          async function generateWorkflow() {
            const templates = JSON.parse(TEMPLATE_DATA || '[]');
            const recommendedNodes = JSON.parse(RECOMMENDED_NODES || '[]');
            const requirements = JSON.parse(WORKFLOW_REQUIREMENTS || '{}');

            console.log('Available templates:', templates.length);
            console.log('Recommended nodes:', recommendedNodes.join(', '));

            // Build enhanced prompt with template guidance
            const systemPrompt = `You are an expert n8n workflow architect. Generate a workflow based on the user's requirements, using the following template guidance:

          SIMILAR TEMPLATES FOUND:
          ${templates.map(t => `- ${t.name}: ${t.description} (uses: ${t.nodes.join(', ')})`).join('\n')}

          RECOMMENDED NODES TO USE:
          ${recommendedNodes.join(', ')}

          REQUIREMENTS:
          ${JSON.stringify(requirements, null, 2)}

          IMPORTANT RULES:
          1. Only use nodes that exist in n8n - check the recommended nodes list first
          2. Follow the patterns from similar templates when applicable
          3. Ensure all node connections are valid
          4. Include proper error handling
          5. Use appropriate node versions for compatibility

          Output only valid JSON workflow structure.`;

            const userPrompt = `Generate an n8n workflow for: ${requirements.workflow_name}

          Description: ${requirements.description}
          Required integrations: ${requirements.integrations}
          Trigger type: ${requirements.trigger_type}
          Features needed: ${requirements.features?.join(', ')}

          Use the template guidance provided to ensure you're using appropriate, existing nodes.`;

            // Call Claude API
            const response = await callClaudeAPI(systemPrompt, userPrompt);
            const workflow = JSON.parse(response);

            // Save workflow
            fs.writeFileSync('generated_workflow.json', JSON.stringify(workflow, null, 2));
            console.log('✅ Workflow generated successfully');

            // Create generation report
            const report = {
              templates_used: templates.length,
              recommended_nodes: recommendedNodes,
              generation_time: new Date().toISOString(),
              requirements: requirements
            };
            fs.writeFileSync('generation_report.json', JSON.stringify(report, null, 2));
          }

          async function callClaudeAPI(systemPrompt, userPrompt) {
            return new Promise((resolve, reject) => {
              const postData = JSON.stringify({
                model: 'claude-3-sonnet-20240229',
                max_tokens: 4096,
                system: systemPrompt,
                messages: [{ role: 'user', content: userPrompt }]
              });

              const options = {
                hostname: 'api.anthropic.com',
                port: 443,
                path: '/v1/messages',
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'x-api-key': process.env.ANTHROPIC_API_KEY,
                  'anthropic-version': '2023-06-01'
                }
              };

              const req = https.request(options, (res) => {
                let data = '';
                res.on('data', (chunk) => data += chunk);
                res.on('end', () => {
                  try {
                    const response = JSON.parse(data);
                    resolve(response.content[0].text);
                  } catch (error) {
                    reject(error);
                  }
                });
              });

              req.on('error', reject);
              req.write(postData);
              req.end();
            });
          }

          generateWorkflow().catch(console.error);
          EOF

          # Run the generation script
          node generate-with-templates.js

          # Check if workflow was generated
          if [ -f "generated_workflow.json" ]; then
            WORKFLOW_CONTENT=$(cat generated_workflow.json)
            echo "workflow_generated=true" >> $GITHUB_OUTPUT
            echo "Generated workflow successfully"
          else
            echo "workflow_generated=false" >> $GITHUB_OUTPUT
            echo "Failed to generate workflow"
            exit 1
          fi

      - name: Validate Generated Workflow
        id: validate
        if: steps.generate.outputs.workflow_generated == 'true'
        run: |
          echo "🔍 Validating generated workflow..."

          # Run validation script
          if node scripts/validate-workflow.js generated_workflow.json; then
            echo "validation_passed=true" >> $GITHUB_OUTPUT
            echo "✅ Workflow validation passed!"
          else
            echo "validation_passed=false" >> $GITHUB_OUTPUT
            echo "❌ Workflow validation failed!"
            exit 1
          fi

      - name: Create Feature Branch
        id: branch
        if: steps.validate.outputs.validation_passed == 'true'
        run: |
          BRANCH_NAME="workflow/${WORKFLOW_NAME}-${GITHUB_RUN_NUMBER}"
          git checkout -b "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Commit Workflow
        if: steps.validate.outputs.validation_passed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create workflow file
          WORKFLOW_FILE="workflows/${WORKFLOW_NAME}.workflow.json"
          cp generated_workflow.json "$WORKFLOW_FILE"

          git add "$WORKFLOW_FILE"
          git add generation_report.json

          git commit -m "feat: Add ${WORKFLOW_NAME} workflow (template-guided generation)

          - Generated using template-aware AI system
          - Based on ${TEMPLATE_COUNT:-0} similar templates
          - Validated and tested automatically
          - Uses recommended node types for compatibility

          Resolves #${ISSUE_NUMBER}"

      - name: Push to GitHub
        if: steps.validate.outputs.validation_passed == 'true'
        run: |
          git push origin "${{ steps.branch.outputs.branch_name }}"

      - name: Create Pull Request
        id: pr
        if: steps.validate.outputs.validation_passed == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.branch.outputs.branch_name }}
          title: "feat: Add ${{ env.WORKFLOW_NAME }} workflow (Template-Guided)"
          body: |
            ## 🤖 Template-Guided AI-Generated n8n Workflow

            This PR was automatically generated from issue #${{ env.ISSUE_NUMBER }}

            ### 📊 Generation Intelligence
            - **Templates Analyzed**: ${{ needs.find-matching-templates.outputs.template_count || 0 }} similar workflows
            - **Node Recommendations**: Based on community best practices
            - **Validation**: ✅ Automated testing passed
            - **AI Model**: Claude 3 Sonnet with template guidance

            ### 🎯 Workflow Details
            - **Name**: `${{ env.WORKFLOW_NAME }}`
            - **File**: `workflows/${{ env.WORKFLOW_NAME }}.workflow.json`
            - **Complexity**: ${{ needs.analyze-issue.outputs.complexity }}

            ### 🔧 Technical Implementation
            - Used template-matching algorithm to find similar workflows
            - Applied node compatibility validation
            - Ensured all nodes exist in current n8n version
            - Included comprehensive error handling

            ### 📋 Requirements Fulfilled
            ${{ fromJson(env.WORKFLOW_REQUIREMENTS).features }}

            ### 📊 Generation Report
            See `generation_report.json` for detailed generation metrics and template matches.

            ### ✅ Quality Assurance
            - [x] Template compatibility verified
            - [x] Node existence validated
            - [x] Workflow structure tested
            - [x] Error handling implemented
            - [x] JSON syntax validated

  update-issue-status:
    needs: [analyze-issue, generate-workflow-with-templates]
    if: always() && needs.analyze-issue.outputs.should_generate == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Update Issue with Results
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = ${{ env.ISSUE_NUMBER }};
            const success = '${{ needs.generate-workflow-with-templates.result }}' === 'success';

            let body;
            if (success) {
              body = `## ✅ Workflow Generation Complete!

Your workflow **${{ env.WORKFLOW_NAME }}** has been successfully generated and is ready for review!

### 🎯 What Happened
- ✅ Analyzed your requirements
- 🔍 Found ${{ needs.find-matching-templates.outputs.template_count || 0 }} similar templates
- 🤖 Generated workflow using Claude 3 Sonnet with template guidance
- ✅ Validated node compatibility and workflow structure
- 📝 Created pull request for review

### 📋 Next Steps
1. Review the generated workflow in the pull request
2. Test the workflow in your n8n instance
3. Merge the pull request when ready
4. Close this issue

### 🔗 Related Pull Request
The pull request will be linked here automatically.`;
            } else {
              body = `## ❌ Workflow Generation Failed

Unfortunately, there was an issue generating your workflow **${{ env.WORKFLOW_NAME }}**.

### 🔍 What We Tried
- ✅ Analyzed your requirements
- 🔍 Searched for similar templates
- ❌ Generation process encountered an error

### 🛠️ Possible Solutions
1. Please check your issue description for clarity
2. Ensure all required integrations are correctly specified
3. Try simplifying the complexity requirements
4. Consider breaking down into smaller, focused workflows

### 📞 Need Help?
- Review the generation logs in the Actions tab
- Update your issue with more specific requirements
- Tag a maintainer for assistance

We'll continue monitoring this issue for updates!`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });

            // Update issue labels
            if (success) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['workflow-generated', 'ready-for-review']
              });
            } else {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['generation-failed', 'needs-clarification']
              });
            }
